<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dukan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f3;--card:#fff;--tx:#1d2a1f;--mut:#65705f;--ac:#1f7a3d;--acx:#fff;--bd:#dfe4d8;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121612;--card:#1b221b;--tx:#eef3ea;--mut:#9aa595;--ac:#4cbf70;--acx:#0b1a0f;--bd:#2c372c;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:30px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
h1{font-size:22px;margin:18px 0 4px}h2{font-size:17px;margin:16px 0 6px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nm{font-weight:600}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.add{display:flex;gap:6px;margin-top:6px}.add input{flex:2}.add select{flex:1.2}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.err{color:var(--bad);font-size:14px;min-height:18px}
.hide{display:none}
a.lnk{color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== CUSTOMER CORNER ===== -->
<div id="cust">
  <h1 id="shop"></h1><div class="mut">Saman chuniye, jitna chahiye utna likhiye (jaise 250 gm ya 1.125 kg).</div>
  <div id="items"></div>
  <h2>Aapka Cart</h2>
  <div class="card" id="cart"></div>
  <h2>Delivery Details</h2>
  <input id="cn" placeholder="Aapka naam" autocomplete="name">
  <input id="cp" placeholder="Mobile number" inputmode="tel" autocomplete="tel">
  <textarea id="ca" rows="3" placeholder="Poora address (gali, mohalla, landmark)" autocomplete="street-address"></textarea>
  <div class="err" id="cerr"></div>
  <button class="btn" id="order" style="width:100%">Order Karein</button>
  <div class="card hide" id="done"></div>
  <p style="text-align:center;margin-top:22px"><a class="lnk" id="toOwner">Dukandar Corner</a></p>
</div>

<!-- ===== OWNER CORNER ===== -->
<div id="own" class="hide">
  <h1>Dukandar Corner</h1>
  <div id="login">
    <input id="pw" type="password" placeholder="Login code" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" id="lbtn" style="width:100%">Login</button>
  </div>
  <div id="panel" class="hide">
    <div class="row"><span class="mut">Login hai</span><button class="btn alt" id="lout">Logout</button></div>
    <h2>Naya saman / bhaav</h2>
    <div class="card">
      <input id="in" placeholder="Saman ka naam">
      <select id="iu"><option value="kg">kg (daam 1 kg ka)</option><option value="litre">litre (daam 1 litre ka)</option><option value="piece">piece/packet (daam 1 ka)</option></select>
      <input id="ip" type="number" min="0" step="any" placeholder="Daam (Rs)">
      <div class="err" id="oerr"></div>
      <button class="btn" id="isave" style="width:100%">Save</button>
    </div>
    <h2>Mera saman</h2><div id="oitems"></div>
    <h2>Pichhle orders</h2><div id="oorders"></div>
  </div>
  <p style="text-align:center;margin-top:22px"><a class="lnk" id="toCust">Customer Corner par wapas</a></p>
</div>

</div>
<script>
// ===== SIRF YE 3 LINE BADLEIN =====
var CFG = { SHOP: "Meri Dukan", URL: "https://bdqqhbmjhspujitypiqd.supabase.co", KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcXFoYm1qaHNwdWppdHlwaXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NzkwNzcsImV4cCI6MjEwODA1NTA3N30.eAsj_tfyOkiNU-1eXbNFBRxrcUgRKzBjiMSqa0KezAU" };
// ==================================
var $ = function(i){return document.getElementById(i)};
var H = {apikey:CFG.KEY, Authorization:"Bearer "+CFG.KEY, "Content-Type":"application/json"};
var items = [], cart = [], token = null;
try{ token = sessionStorage.getItem("tok"); }catch(e){}
document.title = CFG.SHOP; $("shop").textContent = CFG.SHOP;
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function money(x){return "Rs "+(Math.round(x*100)/100)}
function fq(q,u){
  if(u==="kg") return q<1 ? Math.round(q*1000)+" gm" : +q.toFixed(3)+" kg";
  if(u==="litre") return q<1 ? Math.round(q*1000)+" ml" : +q.toFixed(3)+" litre";
  return q+" piece";
}
function api(body){
  return fetch(CFG.URL+"/functions/v1/shop",{method:"POST",headers:H,body:JSON.stringify(body)})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
     if(!r.ok){var e=new Error(j.error||"Kuch gadbad hui, dobara try karein");e.status=r.status;throw e}
     return j})});
}

/* ---------- Customer ---------- */
function loadItems(){
  fetch(CFG.URL+"/rest/v1/items?select=*&active=eq.true&order=name",{headers:H})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(d){items=d;renderItems()})
   .catch(function(){$("items").innerHTML='<div class="card err">Saman load nahi hua. Internet ya setup check karein.</div>'});
}
function renderItems(){
  if(!items.length){$("items").innerHTML='<div class="card mut">Abhi koi saman nahi hai.</div>';return}
  $("items").innerHTML = items.map(function(it){
    var opts = it.unit==="kg" ? '<option>gm</option><option>kg</option>' : it.unit==="litre" ? '<option>ml</option><option>litre</option>' : '<option>piece</option>';
    return '<div class="card"><div class="row"><span class="nm">'+esc(it.name)+'</span><span class="mut">'+money(it.price)+' / '+(it.unit==="piece"?"piece":it.unit)+'</span></div>'
     +'<div class="add"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Matra" id="q'+it.id+'"><select id="s'+it.id+'">'+opts+'</select>'
     +'<button class="btn" data-add="'+it.id+'">Add</button></div></div>';
  }).join("");
}
$("items").addEventListener("click",function(e){
  var b=e.target.closest("[data-add]"); if(!b) return;
  var id=+b.dataset.add, it=items.filter(function(x){return x.id===id})[0]; if(!it) return;
  var v=parseFloat($("q"+id).value), s=$("s"+id).value;
  if(!(v>0)){$("cerr").textContent="Sahi matra likhiye.";return}
  var base=(s==="gm"||s==="ml")?v/1000:v;
  if(it.unit==="piece" && base%1!==0){$("cerr").textContent="Piece me poori ginti likhiye.";return}
  if(base>1000){$("cerr").textContent="Itni matra nahi ho sakti.";return}
  $("cerr").textContent="";
  cart = cart.filter(function(c){return c.id!==id}); cart.push({id:id,qty:base});
  $("q"+id).value=""; renderCart();
});
function renderCart(){
  if(!cart.length){$("cart").innerHTML='<span class="mut">Cart khaali hai.</span>';return}
  var t=0, h=cart.map(function(c){
    var it=items.filter(function(x){return x.id===c.id})[0]; if(!it) return "";
    var a=Math.round(c.qty*it.price*100)/100; t+=a;
    return '<div class="line"><span>'+esc(it.name)+' - '+fq(c.qty,it.unit)+'</span><span>'+money(a)+' <a class="lnk" data-rm="'+c.id+'">hatao</a></span></div>';
  }).join("");
  $("cart").innerHTML = h+'<div class="line" style="border:0"><b>Kul</b><b>'+money(t)+'</b></div>';
}
$("cart").addEventListener("click",function(e){
  var r=e.target.closest("[data-rm]"); if(!r) return;
  cart=cart.filter(function(c){return c.id!==+r.dataset.rm}); renderCart();
});
$("order").addEventListener("click",function(){
  var n=$("cn").value.trim(), p=$("cp").value.trim(), a=$("ca").value.trim();
  if(!cart.length){$("cerr").textContent="Pehle kuch saman chuniye.";return}
  if(!n||!/^[0-9+\s-]{10,15}$/.test(p)||a.length<8){$("cerr").textContent="Naam, sahi mobile number aur poora address bharna zaroori hai.";return}
  $("cerr").textContent=""; $("order").disabled=true; $("order").textContent="Bhej rahe hain...";
  api({action:"order",name:n,phone:p,address:a,lines:cart})
   .then(function(r){
     cart=[];renderCart();
     $("done").className="card"; $("done").innerHTML="<b>Order mil gaya!</b><br>Kul: "+money(r.total)+"<br>Dukandar jaldi aapse sampark karega.";
     $("done").scrollIntoView({behavior:"smooth"});
   })
   .catch(function(e){$("cerr").textContent=e.message})
   .then(function(){$("order").disabled=false;$("order").textContent="Order Karein"});
});

/* ---------- Owner ---------- */
function show(owner){$("cust").className=owner?"hide":"";$("own").className=owner?"":"hide";if(owner)ownerInit();else loadItems()}
$("toOwner").onclick=function(){show(true)}; $("toCust").onclick=function(){show(false)};
function setTok(t){token=t;try{t?sessionStorage.setItem("tok",t):sessionStorage.removeItem("tok")}catch(e){}}
function ownerInit(){ if(token) loadOwner(); else {$("login").className="";$("panel").className="hide"} }
function auth(e){ if(e.status===401){setTok(null);$("login").className="";$("panel").className="hide";$("lerr").textContent="Session khatam, dobara login karein."} else $("oerr").textContent=e.message }
$("lbtn").onclick=function(){
  $("lerr").textContent=""; $("lbtn").disabled=true;
  api({action:"login",password:$("pw").value}).then(function(r){setTok(r.token);$("pw").value="";loadOwner()})
   .catch(function(e){$("lerr").textContent=e.message}).then(function(){$("lbtn").disabled=false});
};
$("lout").onclick=function(){api({action:"logout",token:token}).catch(function(){}).then(function(){setTok(null);ownerInit()})};
function loadOwner(){
  api({action:"owner_items",token:token}).then(function(r){
    $("login").className="hide";$("panel").className="";
    $("oitems").innerHTML = r.items.length ? r.items.map(function(it){
      return '<div class="card"><div class="nm">'+esc(it.name)+' <span class="mut">('+it.unit+')</span></div>'
       +'<div class="add"><input type="number" min="0" step="any" value="'+it.price+'" id="p'+it.id+'">'
       +'<button class="btn" data-up="'+it.id+'">Daam Save</button>'
       +'<button class="btn alt" data-tg="'+it.id+'">'+(it.active?"Chhupao":"Dikhao")+'</button>'
       +'<button class="btn bad" data-del="'+it.id+'">Hatao</button></div></div>';
    }).join("") : '<div class="mut">Abhi koi saman nahi.</div>';
    window._oi=r.items;
    return api({action:"orders",token:token});
  }).then(function(r){
    $("oorders").innerHTML = r.orders.length ? r.orders.map(function(o){
      var l=(o.lines||[]).map(function(x){return esc(x.name)+": "+fq(x.qty,x.unit)}).join(", ");
      return '<div class="card"><div class="mut">'+new Date(o.created_at).toLocaleString()+'</div><b>'+esc(o.customer)+'</b> - '+esc(o.phone)+'<br>'+esc(o.address)+'<br>'+l+'<br><b>'+money(o.total)+'</b></div>';
    }).join("") : '<div class="mut">Abhi koi order nahi.</div>';
  }).catch(auth);
}
function saveItem(row){return api({action:"save_item",token:token,id:row.id,name:row.name,unit:row.unit,price:row.price,active:row.active})}
$("isave").onclick=function(){
  $("oerr").textContent="";
  saveItem({name:$("in").value,unit:$("iu").value,price:$("ip").value,active:true})
   .then(function(){$("in").value="";$("ip").value="";loadOwner()}).catch(auth);
};
$("oitems").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var id=+(b.dataset.up||b.dataset.tg||b.dataset.del), it=(window._oi||[]).filter(function(x){return x.id===id})[0]; if(!it) return;
  var p;
  if(b.dataset.up) p=saveItem({id:id,name:it.name,unit:it.unit,price:$("p"+id).value,active:it.active});
  else if(b.dataset.tg) p=saveItem({id:id,name:it.name,unit:it.unit,price:it.price,active:!it.active});
  else { if(!confirm(it.name+" hata dein?")) return; p=api({action:"delete_item",token:token,id:id}); }
  p.then(loadOwner).catch(auth);
});

renderCart(); loadItems();
</script>
</body>
</html>
